<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map & 3D Preview</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body class="bg-light">

<div class="container-fluid d-flex flex-column vh-100 p-3">
    <!-- Top Controls Row 1: toggles + buttons -->
    <div class="row mb-2 top-controls">
        <div class="col-12 d-flex flex-wrap align-items-center gap-2">

            <button id="sendButton" class="btn btn-primary">Generate 3D Terrain</button>

            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="toggle1">
                <label class="form-check-label" for="toggle1">High Resolution (may take much longer)</label>
            </div>

        </div>
    </div>

    <!-- Main Content Row -->
    <div class="row flex-grow-1 g-3 align-items-stretch">
        <!-- Left Column: Map -->
        <div class="col-12 col-md-6 d-flex flex-column flex-grow-1">
            <div id="map-container" class="flex-grow-1">
                {{ map_html | safe }}
            </div>
        </div>

        <div class="col-12 col-md-6 d-flex flex-column flex-grow-1 position-relative viewer-container">
            <model-viewer id="previewModel"
                          src="" 
                          alt="Loading 3D preview"
                          camera-controls
                          camera-orbit="0deg 150deg 500m"
                          class="flex-grow-1 w-100 bg-secondary rounded">
            </model-viewer>

            <!-- Overlays -->
            <div id="LoadingTextOverlay" class="overlay">
                Preview Loading...
            </div>
            <div id="BeginningTextOverlay" class="overlay">
                Select an area for a preview!
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='map.js') }}"></script>
</body>
</html>
